output: dist/
releases:
  - name: prod
    jobs:
      - name: release-windows-exe-x64
        package:
          platform: windows
          target: exe
          build_args:
            target: lib/main_prod.dart

      - name: release-windows-exe-arm64
        package:
          platform: windows
          target: exe
          build_args:
            target: lib/main_prod.dart
            dart-define: FLUTTER_BUILD_MODE=release

      - name: release-windows-msix
        package:
          platform: windows
          target: msix
          build_args:
            target: lib/main_prod.dart

      - name: release-android-apk
        package:
          platform: android
          target: apk
          build_args:
            target-platform: android-arm,android-arm64,android-x64

      - name: release-android-bundle
        package:
          platform: android
          target: aab
          build_args:
            target-platform: android-arm,android-arm64,android-x64
