name: Build Windows

on:
  push:
    branches: [ v, lankuai ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.8'
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows app
        run: flutter build windows --release --target lib/main_prod.dart

      - name: Verify build output
        shell: pwsh
        run: |
          Write-Host "Checking build output..."
          if (Test-Path "build\windows\x64\runner\Release\lankuai.exe") {
            Write-Host "✓ lankuai.exe found"
            Get-ChildItem "build\windows\x64\runner\Release\" | Format-Table Name, Length
          } else {
            Write-Host "✗ lankuai.exe not found!"
            Get-ChildItem "build\windows\x64\runner\Release\" -ErrorAction SilentlyContinue | Format-Table Name, Length
            exit 1
          }

      - name: Get app version
        id: version
        shell: pwsh
        run: |
          $content = Get-Content pubspec.yaml
          $version = ($content | Select-String -Pattern '^version: (.+)$').Matches.Groups[1].Value
          echo "version=$version" >> $env:GITHUB_OUTPUT

      - name: Create Windows ZIP package
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $appName = "lankuai-$version-windows"
          New-Item -ItemType Directory -Force -Path dist
          Compress-Archive -Path "build\windows\x64\runner\Release\*" -DestinationPath "dist\$appName.zip" -Force
          Write-Host "Created package: dist\$appName.zip"
          Write-Host "Package size: $((Get-Item "dist\$appName.zip").Length / 1MB) MB"

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: |
            dist/*.zip
          retention-days: 30

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: dist/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
