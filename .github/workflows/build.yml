name: Build

on:
  workflow_call:
    inputs:
      upload-artifact:
        type: boolean
        default: true
      tag-name:
        type: string
        default: "draft"
      channel:
        type: string
        default: "dev"

env:
  IS_GITHUB_ACTIONS: 1
  CHANNEL: "${{ inputs.channel }}"
  FLUTTER_VERSION: '3.24.0'
  UPLOAD_ARTIFACT: "${{ inputs.upload-artifact }}"
  TAG_NAME: "${{ inputs.tag-name }}"
  TARGET_NAME_apk: "Hiddify-Android"
  TARGET_NAME_exe: "Hiddify-Windows-x64"
  TARGET_NAME_dmg: "Hiddify-MacOS"
  TARGET_NAME_pkg: "Hiddify-MacOS-Installer"
  TARGET_NAME_ipa: "Hiddify-iOS"
  TARGET_NAME_AppImage: "Hiddify-Linux-x64"
  TARGET_NAME_deb: "Hiddify-Debian-x64"
  TARGET_NAME_rpm: "Hiddify-rpm-x64"

jobs:
  build_linux:
    if: false  # 暂时禁用 Linux 构建
    permissions: write-all
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Flutter
        uses: subosito/flutter-action@v2.16.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Setup dependencies
        run: make linux-install-dependencies

      - name: Prepare for Linux
        run: make linux-prepare

      - name: Build Linux
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: make linux-release

      - name: Copy to out Linux
        run: |
          ls -R dist/
          mkdir out
          mkdir tmp_out
          for EXT in AppImage deb rpm; do
            KEY=TARGET_NAME_${EXT}
            FILENAME=${!KEY}
            echo "For $EXT ($KEY) filename is ${FILENAME}"
            mv dist/*/*.$EXT tmp_out/${FILENAME}.$EXT
            ls tmp_out
            chmod +x tmp_out/${FILENAME}.$EXT
            cp ./.github/help/linux/* tmp_out/
            mv tmp_out/${FILENAME}.$EXT out/
          done

      - name: Upload Linux Artifact
        if: env.UPLOAD_ARTIFACT == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: linux
          path: ./out
          retention-days: 1

  build_apk:
    if: false  # 暂时禁用 Android 构建
    permissions: write-all
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Flutter
        uses: subosito/flutter-action@v2.13.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true
          
      - name: Set up JDK
        uses: actions/setup-java@v1
        with:
          java-version: '17'
          
      - name: Prepare for Android
        run: |
          make android-prepare
          tree
          
      - name: Install Dependencies
        run: |
          flutter pub get
          dart run build_runner build --delete-conflicting-outputs
          dart run slang

      - name: Build APK
        run: |
          flutter build apk --release

      - name: Upload APK Artifact
        if: env.UPLOAD_ARTIFACT == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 1

  build_windows:
    permissions: write-all
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Flutter
        uses: subosito/flutter-action@v2.16.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Prepare Windows Build
        shell: pwsh
        run: |
          Write-Host "=== Preparing Windows Build ==="
          
          # Get dependencies
          flutter pub get
          dart run build_runner build --delete-conflicting-outputs
          dart run slang
          
          # Read core version
          $coreVersion = (Get-Content dependencies.properties | Where-Object { $_ -match "^core.version=" }) -replace "core.version=", ""
          Write-Host "Core version: $coreVersion"
          
          # Setup directories
          New-Item -ItemType Directory -Force -Path "libcore\bin"
          
          # Download libcore
          $coreUrl = "https://github.com/hiddify/hiddify-next-core/releases/download/v${coreVersion}/hiddify-core-windows-amd64.tar.gz"
          Write-Host "Downloading from: $coreUrl"
          
          # Download and extract
          Invoke-WebRequest -Uri $coreUrl -OutFile "libcore.tar.gz"
          tar xzf libcore.tar.gz -C "libcore\bin"
          Remove-Item "libcore.tar.gz"
          
          # List files
          Get-ChildItem -Path "libcore\bin"

      - name: Build Windows Application
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        shell: pwsh
        run: |
          Write-Host "=== Building Windows Application ==="

          # Activate flutter_distributor
          dart pub global activate flutter_distributor

          # Add to PATH
          $env:PATH = "$env:PATH;$env:USERPROFILE\.pub-cache\bin"

          # Build EXE installer with Inno Setup
          Write-Host "`n=== Building Windows EXE Installer (Inno Setup) ==="
          flutter_distributor package --flutter-build-args=verbose --platform windows --targets exe --skip-clean --build-target lib/main_prod.dart --build-dart-define sentry_dsn="$env:SENTRY_DSN"

          if ($LASTEXITCODE -ne 0) {
            Write-Error "EXE installer build failed with exit code $LASTEXITCODE"
            exit 1
          }

          # Build MSIX package
          Write-Host "`n=== Building Windows MSIX Package ==="
          flutter_distributor package --flutter-build-args=verbose --platform windows --targets msix --skip-clean --build-target lib/main_prod.dart --build-dart-define sentry_dsn="$env:SENTRY_DSN"

          if ($LASTEXITCODE -ne 0) {
            Write-Warning "MSIX build failed - this is expected without a signing certificate"
            Write-Host "Continuing with EXE installer only..."
          } else {
            Write-Host "MSIX build succeeded!"
          }

          Write-Host "`n=== Packaging completed ==="
  
      - name: Package Windows Output
        shell: pwsh
        run: |
          Write-Host "=== Collecting Windows Installers ==="

          # Create output directory
          New-Item -ItemType Directory -Force -Path "out"

          # List all files in dist directory for debugging
          Write-Host "`n=== Contents of dist directory ==="
          if (Test-Path "dist") {
            Get-ChildItem -Recurse -Path "dist" -File | Select-Object FullName, @{Name="Size(MB)";Expression={[math]::Round($_.Length/1MB,2)}} | Format-Table -AutoSize
          } else {
            Write-Error "dist directory not found!"
            exit 1
          }

          # Find and copy EXE installer
          Write-Host "`n=== Searching for EXE installer ==="

          # flutter_distributor with exe target creates a folder with the app files, not an installer
          # We need to look for the actual Inno Setup generated installer or create our own package

          # First, try to find Inno Setup generated installer
          $exeInstaller = Get-ChildItem -Recurse -Path "dist" -Filter "*-windows-setup.exe" -File -ErrorAction SilentlyContinue | Select-Object -First 1

          if (-not $exeInstaller) {
            # If not found, look for the setup executable in different naming patterns
            $exeInstaller = Get-ChildItem -Recurse -Path "dist" -Filter "*Setup*.exe" -File -ErrorAction SilentlyContinue | Select-Object -First 1
          }

          if (-not $exeInstaller) {
            # Last resort: look for any .exe that's larger than 10MB (likely an installer)
            Write-Host "Looking for large EXE files (installers are usually >10MB)..."
            $allExes = Get-ChildItem -Recurse -Path "dist" -Filter "*.exe" -File | Where-Object { $_.Length -gt 10MB }
            if ($allExes) {
              $allExes | ForEach-Object { Write-Host "  Found: $($_.Name) - $([math]::Round($_.Length/1MB,2)) MB" }
              $exeInstaller = $allExes | Select-Object -First 1
            }
          }

          if ($exeInstaller) {
            Write-Host "Found EXE installer: $($exeInstaller.FullName) - $([math]::Round($exeInstaller.Length/1MB,2)) MB"
            Copy-Item -Path $exeInstaller.FullName -Destination "out\Hiddify-Windows-Setup.exe"
          } else {
            Write-Warning "No EXE installer found!"
            Write-Host "`nAll .exe files in dist:"
            Get-ChildItem -Recurse -Path "dist" -Filter "*.exe" | ForEach-Object {
              Write-Host "  - $($_.FullName) - $([math]::Round($_.Length/1MB,2)) MB"
            }

            # Create a portable ZIP as fallback
            Write-Host "`nCreating portable ZIP as fallback..."
            if (Test-Path "build\windows\x64\runner\Release") {
              New-Item -ItemType Directory -Force -Path "temp_package"
              Copy-Item -Path "build\windows\x64\runner\Release\*" -Destination "temp_package\" -Recurse
              Compress-Archive -Force -Path "temp_package\*" -DestinationPath "out\Hiddify-Windows-Portable.zip"
              Write-Host "Created portable ZIP package"
            }
          }

          # Find and copy MSIX package (optional)
          Write-Host "`n=== Searching for MSIX package ==="
          $msixPackage = Get-ChildItem -Recurse -Path "dist" -Filter "*.msix" -File | Select-Object -First 1
          if ($msixPackage) {
            Write-Host "Found MSIX package: $($msixPackage.FullName)"
            Copy-Item -Path $msixPackage.FullName -Destination "out\Hiddify-Windows.msix"
          } else {
            Write-Warning "MSIX package not found - this is expected without code signing certificate"
          }

          # List final output
          Write-Host "`n=== Final installers ==="
          Get-ChildItem -Path "out" | Select-Object Name, @{Name="Size(MB)";Expression={[math]::Round($_.Length/1MB,2)}} | Format-Table -AutoSize
          
      - name: Upload Windows Artifact
        if: env.UPLOAD_ARTIFACT == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: ./out
          retention-days: 1

  build_macos:
    permissions: write-all
    runs-on: macos-13
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Flutter
        uses: subosito/flutter-action@v2.16.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Setup dependencies
        run: |
          make macos-install-dependencies

      - name: Prepare for macOS
        run: |
          make macos-prepare
          tree

      - name: Build macOS
        run: |
          make macos-release

      - name: Copy to out macOS
        run: |
          mkdir out
          mv dist/*/*.dmg out/${TARGET_NAME_dmg}.dmg
          mv dist/*/*.pkg out/${TARGET_NAME_pkg}.pkg

      - name: Upload macOS Artifact
        if: env.UPLOAD_ARTIFACT == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: macOS
          path: ./out
          retention-days: 1

  build_ios:
    if: false  # 暂时禁用 iOS 构建
    permissions: write-all
    runs-on: macos-12
    steps:
      - name: Checkout
        uses: actions/checkout@v3
  
      - name: Setup Flutter
        uses: subosito/flutter-action@v2.16.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true
  
      - name: Clean Flutter Build
        run: |
          flutter clean
  
      - name: Get Flutter Packages
        run: |
          flutter pub get
  
      - name: Reinstall iOS Dependencies
        run: |
          cd ios
          rm -rf Pods Podfile.lock
          pod install
          
      - name: Install tree
        run: brew install tree

      - name: Prepare for iOS
        run: |
          make ios-prepare
          tree
  
      - name: Build iOS (No Code Sign)
        run: |
          flutter build ipa --no-codesign
  
      - name: Copy to out iOS
        run: |
          mkdir out
          mv build/ios/ipa/*.ipa out/${TARGET_NAME_ipa}.ipa
  
      - name: Upload iOS Artifact
        if: env.UPLOAD_ARTIFACT == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: iOS
          path: ./out
          retention-days: 1