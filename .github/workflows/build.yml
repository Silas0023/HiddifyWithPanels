name: Build

on:
  workflow_call:
    inputs:
      upload-artifact:
        type: boolean
        default: true
      tag-name:
        type: string
        default: "draft"
      channel:
        type: string
        default: "dev"

env:
  IS_GITHUB_ACTIONS: 1
  CHANNEL: "${{ inputs.channel }}"
  FLUTTER_VERSION: '3.32.8'
  UPLOAD_ARTIFACT: "${{ inputs.upload-artifact }}"
  TAG_NAME: "${{ inputs.tag-name }}"
  TARGET_NAME_apk: "蓝快加速器-Android"
  TARGET_NAME_exe: "蓝快加速器-Windows-x64"
  TARGET_NAME_dmg: "蓝快加速器-MacOS"
  TARGET_NAME_pkg: "蓝快加速器-MacOS-Installer"
  TARGET_NAME_ipa: "蓝快加速器-iOS"
  TARGET_NAME_AppImage: "蓝快加速器-Linux-x64"
  TARGET_NAME_deb: "蓝快加速器-Debian-x64"
  TARGET_NAME_rpm: "蓝快加速器-rpm-x64"

jobs:
  build_linux:
    if: false  # 暂时禁用 Linux 构建
    permissions: write-all
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Flutter
        uses: subosito/flutter-action@v2.16.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Setup dependencies
        run: make linux-install-dependencies

      - name: Prepare for Linux
        run: make linux-prepare

      - name: Build Linux
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: make linux-release

      - name: Copy to out Linux
        run: |
          ls -R dist/
          mkdir out
          mkdir tmp_out
          for EXT in AppImage deb rpm; do
            KEY=TARGET_NAME_${EXT}
            FILENAME=${!KEY}
            echo "For $EXT ($KEY) filename is ${FILENAME}"
            mv dist/*/*.$EXT tmp_out/${FILENAME}.$EXT
            ls tmp_out
            chmod +x tmp_out/${FILENAME}.$EXT
            cp ./.github/help/linux/* tmp_out/
            mv tmp_out/${FILENAME}.$EXT out/
          done

      - name: Upload Linux Artifact
        if: env.UPLOAD_ARTIFACT == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: linux
          path: ./out
          retention-days: 1

  build_apk:
    if: false  # 暂时禁用 Android 构建
    permissions: write-all
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Flutter
        uses: subosito/flutter-action@v2.13.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true
          
      - name: Set up JDK
        uses: actions/setup-java@v1
        with:
          java-version: '17'
          
      - name: Prepare for Android
        run: |
          make android-prepare
          tree
          
      - name: Install Dependencies
        run: |
          flutter pub get
          dart run build_runner build --delete-conflicting-outputs
          dart run slang

      - name: Build APK
        run: |
          flutter build apk --release

      - name: Upload APK Artifact
        if: env.UPLOAD_ARTIFACT == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 1

  build_windows_x64:
    permissions: write-all
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Flutter
        uses: subosito/flutter-action@v2.16.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Prepare Windows Build
        shell: pwsh
        run: |
          Write-Host "=== Preparing Windows Build ==="
          
          # Get dependencies
          flutter pub get
          dart run build_runner build --delete-conflicting-outputs
          dart run slang
          
          # Read core version
          $coreVersion = (Get-Content dependencies.properties | Where-Object { $_ -match "^core.version=" }) -replace "core.version=", ""
          Write-Host "Core version: $coreVersion"
          
          # Setup directories
          New-Item -ItemType Directory -Force -Path "libcore\bin"
          
          # Download libcore
          $coreUrl = "https://github.com/hiddify/hiddify-next-core/releases/download/v${coreVersion}/hiddify-core-windows-amd64.tar.gz"
          Write-Host "Downloading from: $coreUrl"
          
          # Download and extract
          Invoke-WebRequest -Uri $coreUrl -OutFile "libcore.tar.gz"
          tar xzf libcore.tar.gz -C "libcore\bin"
          Remove-Item "libcore.tar.gz"
          
          # List files
          Get-ChildItem -Path "libcore\bin"

      - name: Build Windows Application
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        shell: pwsh
        run: |
          Write-Host "=== Building Windows Application ==="

          # Activate flutter_distributor
          dart pub global activate flutter_distributor

          # Add to PATH
          $env:PATH = "$env:PATH;$env:USERPROFILE\.pub-cache\bin"

          # Build Windows packages using distribute_options.yaml configuration
          Write-Host "`n=== Building Windows Packages ===\"

          # Build EXE installer for x64
          Write-Host "Building EXE installer for x64 with Inno Setup..."
          flutter_distributor release --name prod --jobs release-windows-exe-x64

          if ($LASTEXITCODE -ne 0) {
            Write-Error "EXE installer build failed"
            exit 1
          }

          # Build MSIX package (optional)
          Write-Host "`nBuilding MSIX package..."
          flutter_distributor release --name prod --jobs release-windows-msix

          if ($LASTEXITCODE -ne 0) {
            Write-Warning "MSIX build failed - this is expected without a signing certificate"
          } else {
            Write-Host "MSIX build succeeded!"
          }

          Write-Host "`n=== Packaging completed ==="
  
      - name: Package Windows Output
        shell: pwsh
        run: |
          Write-Host "=== Collecting Windows Installers ==="

          # Create output directory
          New-Item -ItemType Directory -Force -Path "out"

          # List all files in dist directory for debugging
          Write-Host "`n=== Contents of dist directory ==="
          if (Test-Path "dist") {
            Get-ChildItem -Recurse -Path "dist" -File | Select-Object FullName, @{Name="Size(MB)";Expression={[math]::Round($_.Length/1MB,2)}} | Format-Table -AutoSize
          } else {
            Write-Error "dist directory not found!"
            exit 1
          }

          # Find and copy EXE installer
          Write-Host "`n=== Searching for EXE installer ==="

          # List all files in dist for debugging
          Write-Host "All files in dist directory:"
          Get-ChildItem -Recurse -Path "dist" -File | Select-Object FullName, @{Name="Size(MB)";Expression={[math]::Round($_.Length/1MB,2)}} | Format-Table -AutoSize

          # flutter_distributor creates installers in dist/<version>/ directory
          # Look for .exe files that are installers (typically >50MB with "Setup" in name or just large exe files)
          $exeInstallers = Get-ChildItem -Recurse -Path "dist" -Filter "*.exe" -File | Where-Object {
            $_.Name -match "Setup" -or $_.Length -gt 50MB
          }

          if ($exeInstallers) {
            Write-Host "`nFound EXE installer candidates:"
            $exeInstallers | ForEach-Object {
              Write-Host "  $($_.Name) - $([math]::Round($_.Length/1MB,2)) MB at $($_.DirectoryName)"
            }

            # Use the first (or largest) installer found
            $exeInstaller = $exeInstallers | Sort-Object -Property Length -Descending | Select-Object -First 1
            Write-Host "`nSelected: $($exeInstaller.Name) - $([math]::Round($exeInstaller.Length/1MB,2)) MB"
            Copy-Item -Path $exeInstaller.FullName -Destination "out\$env:TARGET_NAME_exe-Setup.exe"
            Write-Host "Copied to out\$env:TARGET_NAME_exe-Setup.exe"
          } else {
            Write-Error "No EXE installer found in dist directory"
            exit 1
          }

          # Find and copy MSIX package (optional)
          Write-Host "`n=== Searching for MSIX package ==="
          $msixPackage = Get-ChildItem -Recurse -Path "dist" -Filter "*.msix" -File | Select-Object -First 1
          if ($msixPackage) {
            Write-Host "Found MSIX package: $($msixPackage.FullName)"
            Copy-Item -Path $msixPackage.FullName -Destination "out\$env:TARGET_NAME_exe.msix"
          } else {
            Write-Warning "MSIX package not found - this is expected without code signing certificate"
          }

          # List final output
          Write-Host "`n=== Final installers ==="
          Get-ChildItem -Path "out" | Select-Object Name, @{Name="Size(MB)";Expression={[math]::Round($_.Length/1MB,2)}} | Format-Table -AutoSize
          
      - name: Upload Windows x64 Artifact
        if: env.UPLOAD_ARTIFACT == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: ./out
          retention-days: 1

  build_windows_arm64:
    permissions: write-all
    runs-on: windows-11-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Flutter
        uses: subosito/flutter-action@v2.16.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true
          architecture: x64  # Use x64 Flutter on ARM64 via emulation

      - name: Prepare Windows ARM64 Build
        shell: pwsh
        run: |
          Write-Host "=== Preparing Windows ARM64 Build ==="

          # Get dependencies
          flutter pub get
          dart run build_runner build --delete-conflicting-outputs
          dart run slang

          # Read core version
          $coreVersion = (Get-Content dependencies.properties | Where-Object { $_ -match "^core.version=" }) -replace "core.version=", ""
          Write-Host "Core version: $coreVersion"

          # Setup directories
          New-Item -ItemType Directory -Force -Path "libcore\bin"

          # Download x64 libcore (works on ARM64 via emulation)
          $coreUrl = "https://github.com/hiddify/hiddify-next-core/releases/download/v${coreVersion}/hiddify-core-windows-amd64.tar.gz"
          Write-Host "Downloading x64 libcore from: $coreUrl"
          Write-Host "(ARM64 Windows can run x64 binaries via emulation)"

          # Download and extract
          Invoke-WebRequest -Uri $coreUrl -OutFile "libcore.tar.gz"
          tar xzf libcore.tar.gz -C "libcore\bin"
          Remove-Item "libcore.tar.gz"

          # List files
          Get-ChildItem -Path "libcore\bin"

      - name: Build Windows ARM64 Application
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        shell: pwsh
        run: |
          Write-Host "=== Building Windows ARM64 Application ==="

          # Activate flutter_distributor
          dart pub global activate flutter_distributor

          # Add to PATH
          $env:PATH = "$env:PATH;$env:USERPROFILE\.pub-cache\bin"

          # Build Windows ARM64 packages using distribute_options.yaml configuration
          Write-Host "`n=== Building Windows ARM64 Packages ===\"

          # Build EXE installer for ARM64
          Write-Host "Building EXE installer for ARM64 with Inno Setup..."
          flutter_distributor release --name prod --jobs release-windows-exe-arm64

          if ($LASTEXITCODE -ne 0) {
            Write-Error "ARM64 EXE installer build failed"
            exit 1
          }

          Write-Host "`n=== Packaging completed ==="

      - name: Package Windows ARM64 Output
        shell: pwsh
        run: |
          Write-Host "=== Collecting Windows ARM64 Installers ==="

          # Create output directory
          New-Item -ItemType Directory -Force -Path "out"

          # List all files in dist directory for debugging
          Write-Host "`n=== Contents of dist directory ==="
          if (Test-Path "dist") {
            Get-ChildItem -Recurse -Path "dist" -File | Select-Object FullName, @{Name="Size(MB)";Expression={[math]::Round($_.Length/1MB,2)}} | Format-Table -AutoSize
          } else {
            Write-Error "dist directory not found!"
            exit 1
          }

          # Find and copy EXE installer
          Write-Host "`n=== Searching for EXE installer ==="

          # List all files in dist for debugging
          Write-Host "All files in dist directory:"
          Get-ChildItem -Recurse -Path "dist" -File | Select-Object FullName, @{Name="Size(MB)";Expression={[math]::Round($_.Length/1MB,2)}} | Format-Table -AutoSize

          # flutter_distributor creates installers in dist/<version>/ directory
          # Look for .exe files that are installers (typically >50MB with "Setup" in name or just large exe files)
          $exeInstallers = Get-ChildItem -Recurse -Path "dist" -Filter "*.exe" -File | Where-Object {
            $_.Name -match "Setup" -or $_.Length -gt 50MB
          }

          if ($exeInstallers) {
            Write-Host "`nFound EXE installer candidates:"
            $exeInstallers | ForEach-Object {
              Write-Host "  $($_.Name) - $([math]::Round($_.Length/1MB,2)) MB at $($_.DirectoryName)"
            }

            # Use the first (or largest) installer found
            $exeInstaller = $exeInstallers | Sort-Object -Property Length -Descending | Select-Object -First 1
            Write-Host "`nSelected: $($exeInstaller.Name) - $([math]::Round($exeInstaller.Length/1MB,2)) MB"
            Copy-Item -Path $exeInstaller.FullName -Destination "out\蓝快加速器-Windows-ARM64-Setup.exe"
            Write-Host "Copied to out\蓝快加速器-Windows-ARM64-Setup.exe"
          } else {
            Write-Error "No EXE installer found in dist directory"
            exit 1
          }

          # List final output
          Write-Host "`n=== Final installers ===\"
          Get-ChildItem -Path "out" | Select-Object Name, @{Name="Size(MB)";Expression={[math]::Round($_.Length/1MB,2)}} | Format-Table -AutoSize

      - name: Upload Windows ARM64 Artifact
        if: env.UPLOAD_ARTIFACT == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: windows-arm64
          path: ./out
          retention-days: 1

  build_macos:
    permissions: write-all
    runs-on: macos-13
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Flutter
        uses: subosito/flutter-action@v2.16.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Setup dependencies
        run: |
          brew install create-dmg tree
          npm install -g appdmg
          dart pub global activate flutter_distributor

      - name: Prepare for macOS
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: |
          export PATH="$PATH:$HOME/.pub-cache/bin"
          make macos-prepare
          tree

      - name: Build macOS
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: |
          export PATH="$PATH:$HOME/.pub-cache/bin"
          which flutter_distributor || echo "flutter_distributor not in PATH"
          flutter_distributor --version || echo "flutter_distributor command failed"
          make macos-release

      - name: Copy to out macOS
        run: |
          mkdir out
          mv dist/*/*.dmg out/${TARGET_NAME_dmg}.dmg
          mv dist/*/*.pkg out/${TARGET_NAME_pkg}.pkg

      - name: Upload macOS Artifact
        if: env.UPLOAD_ARTIFACT == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: macOS
          path: ./out
          retention-days: 1

  build_ios:
    if: false  # 暂时禁用 iOS 构建
    permissions: write-all
    runs-on: macos-12
    steps:
      - name: Checkout
        uses: actions/checkout@v3
  
      - name: Setup Flutter
        uses: subosito/flutter-action@v2.16.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true
  
      - name: Clean Flutter Build
        run: |
          flutter clean
  
      - name: Get Flutter Packages
        run: |
          flutter pub get
  
      - name: Reinstall iOS Dependencies
        run: |
          cd ios
          rm -rf Pods Podfile.lock
          pod install
          
      - name: Install tree
        run: brew install tree

      - name: Prepare for iOS
        run: |
          make ios-prepare
          tree
  
      - name: Build iOS (No Code Sign)
        run: |
          flutter build ipa --no-codesign
  
      - name: Copy to out iOS
        run: |
          mkdir out
          mv build/ios/ipa/*.ipa out/${TARGET_NAME_ipa}.ipa
  
      - name: Upload iOS Artifact
        if: env.UPLOAD_ARTIFACT == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: iOS
          path: ./out
          retention-days: 1