name: Build

on:
  workflow_call:
    inputs:
      upload-artifact:
        type: boolean
        default: true
      tag-name:
        type: string
        default: "draft"
      channel:
        type: string
        default: "dev"

env:
  IS_GITHUB_ACTIONS: 1
  CHANNEL: "${{ inputs.channel }}"
  FLUTTER_VERSION: '3.24.0'
  UPLOAD_ARTIFACT: "${{ inputs.upload-artifact }}"
  TAG_NAME: "${{ inputs.tag-name }}"
  TARGET_NAME_apk: "Hiddify-Android"
  TARGET_NAME_exe: "Hiddify-Windows-x64"
  TARGET_NAME_dmg: "Hiddify-MacOS"
  TARGET_NAME_pkg: "Hiddify-MacOS-Installer"
  TARGET_NAME_ipa: "Hiddify-iOS"
  TARGET_NAME_AppImage: "Hiddify-Linux-x64"
  TARGET_NAME_deb: "Hiddify-Debian-x64"
  TARGET_NAME_rpm: "Hiddify-rpm-x64"

jobs:
  build_linux:
    if: false  # 暂时禁用 Linux 构建
    permissions: write-all
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Flutter
        uses: subosito/flutter-action@v2.16.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Setup dependencies
        run: make linux-install-dependencies

      - name: Prepare for Linux
        run: make linux-prepare

      - name: Build Linux
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: make linux-release

      - name: Copy to out Linux
        run: |
          ls -R dist/
          mkdir out
          mkdir tmp_out
          for EXT in AppImage deb rpm; do
            KEY=TARGET_NAME_${EXT}
            FILENAME=${!KEY}
            echo "For $EXT ($KEY) filename is ${FILENAME}"
            mv dist/*/*.$EXT tmp_out/${FILENAME}.$EXT
            ls tmp_out
            chmod +x tmp_out/${FILENAME}.$EXT
            cp ./.github/help/linux/* tmp_out/
            mv tmp_out/${FILENAME}.$EXT out/
          done

      - name: Upload Linux Artifact
        if: env.UPLOAD_ARTIFACT == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: linux
          path: ./out
          retention-days: 1

  build_apk:
    if: false  # 暂时禁用 Android 构建
    permissions: write-all
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Flutter
        uses: subosito/flutter-action@v2.13.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true
          
      - name: Set up JDK
        uses: actions/setup-java@v1
        with:
          java-version: '17'
          
      - name: Prepare for Android
        run: |
          make android-prepare
          tree
          
      - name: Install Dependencies
        run: |
          flutter pub get
          dart run build_runner build --delete-conflicting-outputs
          dart run slang

      - name: Build APK
        run: |
          flutter build apk --release

      - name: Upload APK Artifact
        if: env.UPLOAD_ARTIFACT == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 1

  build_windows:
    permissions: write-all
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Flutter
        uses: subosito/flutter-action@v2.16.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Prepare Windows Build
        shell: pwsh
        run: |
          Write-Host "=== Preparing Windows Build ==="
          
          # Get dependencies
          flutter pub get
          dart run build_runner build --delete-conflicting-outputs
          dart run slang
          
          # Read core version
          $coreVersion = (Get-Content dependencies.properties | Where-Object { $_ -match "^core.version=" }) -replace "core.version=", ""
          Write-Host "Core version: $coreVersion"
          
          # Setup directories
          New-Item -ItemType Directory -Force -Path "libcore\bin"
          
          # Download libcore
          $coreUrl = "https://github.com/hiddify/hiddify-next-core/releases/download/v${coreVersion}/hiddify-core-windows-amd64.tar.gz"
          Write-Host "Downloading from: $coreUrl"
          
          # Download and extract
          Invoke-WebRequest -Uri $coreUrl -OutFile "libcore.tar.gz"
          tar xzf libcore.tar.gz -C "libcore\bin"
          Remove-Item "libcore.tar.gz"
          
          # List files
          Get-ChildItem -Path "libcore\bin"

      - name: Build Windows Application
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        shell: pwsh
        run: |
          Write-Host "=== Building Windows Application ==="

          # Activate flutter_distributor
          dart pub global activate flutter_distributor

          # Add to PATH
          $env:PATH = "$env:PATH;$env:USERPROFILE\.pub-cache\bin"

          # Build with flutter_distributor - try targets separately to see which fails
          Write-Host "`n=== Building Windows EXE ==="
          flutter_distributor package --flutter-build-args=verbose --platform windows --targets exe --skip-clean --build-dart-define sentry_dsn="$env:SENTRY_DSN"

          if ($LASTEXITCODE -ne 0) {
            Write-Error "EXE build failed with exit code $LASTEXITCODE"
            exit 1
          }

          Write-Host "`n=== Building Windows MSIX ==="
          flutter_distributor package --flutter-build-args=verbose --platform windows --targets msix --skip-clean --build-dart-define sentry_dsn="$env:SENTRY_DSN"

          if ($LASTEXITCODE -ne 0) {
            Write-Warning "MSIX build failed with exit code $LASTEXITCODE - continuing without MSIX"
          }
  
      - name: Package Windows Output
        shell: pwsh
        run: |
          Write-Host "=== Packaging Windows Output ==="

          # Create output directories
          New-Item -ItemType Directory -Force -Path "out"
          New-Item -ItemType Directory -Force -Path "dist\tmp"

          # Debug: List all files in dist directory
          Write-Host "=== Contents of dist directory ==="
          if (Test-Path "dist") {
            Get-ChildItem -Recurse -Path "dist" | Select-Object FullName, Length | Format-Table -AutoSize
          } else {
            Write-Host "WARNING: dist directory does not exist!"
          }

          # Search for installer files
          Write-Host "`n=== Searching for EXE files ==="
          $exeFiles = Get-ChildItem -Recurse -Path "dist" -Filter "*.exe" -ErrorAction SilentlyContinue
          if ($exeFiles) {
            $exeFiles | ForEach-Object { Write-Host "Found EXE: $($_.FullName)" }
            $exeFiles | Select-Object -First 1 | Copy-Item -Destination "out\Hiddify-Windows-Setup-x64.exe"
          } else {
            Write-Host "WARNING: No EXE files found in dist directory"
          }

          Write-Host "`n=== Searching for MSIX files ==="
          $msixFiles = Get-ChildItem -Recurse -Path "dist" -Filter "*.msix" -ErrorAction SilentlyContinue
          if ($msixFiles) {
            $msixFiles | ForEach-Object { Write-Host "Found MSIX: $($_.FullName)" }
            $msixFiles | Select-Object -First 1 | Copy-Item -Destination "out\Hiddify-Windows-Setup-x64.msix"
          } else {
            Write-Host "WARNING: No MSIX files found in dist directory"
          }

          # Create portable package
          Write-Host "`n=== Creating portable ZIP ==="
          if (Test-Path "build\windows\x64\runner\Release") {
            Copy-Item -Path "build\windows\x64\runner\Release" -Destination "dist\tmp\hiddify-next" -Recurse
            Copy-Item -Path ".github\help\mac-windows\*.url" -Destination "dist\tmp\hiddify-next\" -ErrorAction SilentlyContinue
            Compress-Archive -Force -Path "dist\tmp\hiddify-next" -DestinationPath "out\Hiddify-Windows-Portable-x64.zip"
          } else {
            Write-Host "WARNING: build\windows\x64\runner\Release directory not found"
          }

          # List output
          Write-Host "`n=== Final output directory contents ==="
          Get-ChildItem -Path "out" | Select-Object Name, Length | Format-Table -AutoSize
          
      - name: Upload Windows Artifact
        if: env.UPLOAD_ARTIFACT == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: ./out
          retention-days: 1

  build_macos:
    permissions: write-all
    runs-on: macos-13
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Flutter
        uses: subosito/flutter-action@v2.16.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Setup dependencies
        run: |
          make macos-install-dependencies

      - name: Prepare for macOS
        run: |
          make macos-prepare
          tree

      - name: Build macOS
        run: |
          make macos-release

      - name: Copy to out macOS
        run: |
          mkdir out
          mv dist/*/*.dmg out/${TARGET_NAME_dmg}.dmg
          mv dist/*/*.pkg out/${TARGET_NAME_pkg}.pkg

      - name: Upload macOS Artifact
        if: env.UPLOAD_ARTIFACT == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: macOS
          path: ./out
          retention-days: 1

  build_ios:
    if: false  # 暂时禁用 iOS 构建
    permissions: write-all
    runs-on: macos-12
    steps:
      - name: Checkout
        uses: actions/checkout@v3
  
      - name: Setup Flutter
        uses: subosito/flutter-action@v2.16.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true
  
      - name: Clean Flutter Build
        run: |
          flutter clean
  
      - name: Get Flutter Packages
        run: |
          flutter pub get
  
      - name: Reinstall iOS Dependencies
        run: |
          cd ios
          rm -rf Pods Podfile.lock
          pod install
          
      - name: Install tree
        run: brew install tree

      - name: Prepare for iOS
        run: |
          make ios-prepare
          tree
  
      - name: Build iOS (No Code Sign)
        run: |
          flutter build ipa --no-codesign
  
      - name: Copy to out iOS
        run: |
          mkdir out
          mv build/ios/ipa/*.ipa out/${TARGET_NAME_ipa}.ipa
  
      - name: Upload iOS Artifact
        if: env.UPLOAD_ARTIFACT == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: iOS
          path: ./out
          retention-days: 1